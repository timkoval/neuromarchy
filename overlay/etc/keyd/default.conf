[ids]
*

[main]
# Tap Caps Lock for Escape, hold for Control. Physical Escape is Caps Lock.
capslock = overload(control, esc)
esc = capslock

# UK ISO physical keys, same mapping as Darwin iso-remapping.nix:
# extra key next to left Shift -> grave/tilde
# grave/tilde key -> backslash
# backslash key -> Return
102nd = grave
grave = backslash
backslash = enter
